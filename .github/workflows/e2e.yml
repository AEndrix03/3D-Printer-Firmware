name: e2e

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware-driver:
    # Firmware reale (compilato per PC su scheda simulata) contro il core reale del driver.
    # Gira in entrambi i repository: una modifica al protocollo da un lato solo rompe la build.
    runs-on: ubuntu-latest
    steps:
      # Un ramo di lavoro che tocca il protocollo esiste con lo stesso nome in entrambi i
      # repository: si prova contro quello, altrimenti contro il ramo principale dell'altro.
      - name: Pick the matching branch of the other repository
        id: companion
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads "https://github.com/AEndrix03/3DP-Driver-Core.git" "$branch" >/dev/null 2>&1; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout driver
        uses: actions/checkout@v4
        with:
          repository: AEndrix03/3DP-Driver-Core
          ref: ${{ steps.companion.outputs.ref }}
          path: 3DP-Driver-Core
      - name: Checkout firmware
        uses: actions/checkout@v4
        with:
          repository: AEndrix03/3D-Printer-Firmware
          path: 3D-Printer-Firmware
      - name: Run end-to-end tests
        run: bash 3DP-Driver-Core/tests/integration/run.sh 3D-Printer-Firmware

  uno-budget:
    # Il firmware deve compilare per Arduino Uno senza warning e restare nei limiti di flash e RAM.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      - name: Check flash and RAM budget
        run: bash tools/check_budget.sh --symbols
